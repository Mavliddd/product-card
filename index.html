<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>products card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="background"></div>
    <h1 class="title-product main-title">Выбери свой продукт</h1>
    <ul class="products-list">
      <button id="change-color-all-card" class="btn-style">Сменить цвет карточек</button>
      <button id="change-color-first-card" class="btn-style">Сменить цвет первой карточки</button>
      <button id="open-google" class="btn-style">Открыть Google</button>
      <button id="output-console-log" class="btn-style">Вывести в консоль</button>
      <button id="color-switching" class="bg-red  btn-style">Переключение цветов</button>
    </ul>

    <button id="open-modal">Регистрация</button>
    <div class="overlay">
      <div class="modal">
        <span class="close">&times;</span>
        <h2>Регистрация</h2>
        <form id="registrationForm">
          <label for="firstName">Имя:</label>
          <input type="text" id="firstName" name="firstName" required placeholder="Введите ваше имя">
          <label for="lastName">Фамилия:</label>
          <input type="text" id="lastName" name="lastName" required placeholder="Введите вашу фамилию">
          <label for="birthDate">Дата рождения:</label>
          <input type="date" id="birthDate" name="birthDate" required>
          <label for="login">Логин:</label>
          <input type="text" id="login" name="login" required minlength="3" placeholder="Минимум 3 символа">
          <label for="password">Пароль:</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
          <label for="confirmPassword">Повторите пароль:</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Повторите пароль">
          <button type="submit">Зарегистрироваться</button>
        </form>
     </div>
    </div>
  </div>
  <div class="site-footer">
    <footer class="footer-container">
      <div class="grup-container">
        <div class="footer__brand">
          <div class="footer_logo">Product Cards</div>
          <div class="footer_description">У нас самые лучшие продукты для кожи!</div>
          <div>
            <a href="#">
              <img src="/image/telegram-icon.png" alt="иконка телеграмм">
              <img src="/image/vkontakte-icon.png" alt="иконка вконтакте" class="vk">
           </a>
         </div>
       </div>
       <div class="footer__subscribe">
        <div class="footer__subscribe-title">Подпишись на наши акции:</div>
        <form class="input-button">
          <input type="email" placeholder="Введите Email" class="subscribe-input" required>
          <button type="submit" class="subscribe-btn">| Подписаться</button>
        </form>
      </div>
      <nav class="footer__nav">
        <div class="footer__nav-title">Быстрые ссылки</div>
        <a class="footer__nav-link"  href="#">Главная</a>
        <a class="footer__nav-link" href="#">Магазин</a>
        <a class="footer__nav-link" href="#">Контакты</a>
      </nav>
    </div>
    </footer>
    <div class="footer__bottom">
      <div class="footer__divider"></div>
      www.product-cards.com© all right reserve
    </div>
  </div>
      
  <script src="main.js"></script>
  <script src="homework-9.js"></script>
</body>
</html>
