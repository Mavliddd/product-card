<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>products card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background"></div>
    <h1 class="title-product main-title">Выбери свой продукт</h1>
    <ul id="productItem" class="products-list">
        <button id="change-color-all-card" class="btn-style">Сменить цвет карточек</button>
        <button id="change-color-first-card" class="btn-style">Сменить цвет первой карточки</button>
        <button id="open-google" class="btn-style">Открыть Google</button>
        <button id="output-console-log" class="btn-style">Вывести в консоль</button>
        <button id="color-switching" class="bg-red  btn-style">Переключение цветов</button>
        <template id="product-template">
      <li class="card-list__item">
        <img class="product-img" alt="img" width="290" height="245"/>
        <span class="description"></span>
        <h3 class="name"></h3>
        <p class="product-properties"></p>
        <span>Состав:</span>
        <ul class="composition-list">
        </ul>
        <div class="price-container">
          <span class="price">Цена</span>
          <span class="cost-product"></span>
        </div>
      </li>
</template>
    </ul>
  <script src="main.js"></script>
  <script src="homework-5.js"></script>
  <script src="homework-6.js"></script>
  <script type="module" src="homework-7.js"></script>
  <script type="module" src="homework-8.js"></script>
  </body>
</html>
